<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer scanning ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="24 12" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Corner FaceID scanner brackets -->
  <path d="M 140 190 L 140 150 A 20 20 0 0 1 160 130 L 200 130" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 312 130 L 352 130 A 20 20 0 0 1 372 150 L 372 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 140 322 L 140 362 A 20 20 0 0 0 160 382 L 200 382" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 312 382 L 352 382 A 20 20 0 0 0 372 362 L 372 322" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Central Graduation Cap & Face Node -->
  <polygon points="256,180 340,225 256,265 172,225" fill="url(#capGrad)" />
  <path d="M 200 248 L 200 285 Q 256 320 312 285 L 312 248" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <!-- Cap Tassel -->
  <path d="M 325 220 L 345 255 L 345 285" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <circle cx="345" cy="288" r="4" fill="#fbbf24" />

  <!-- STEM Brand Text -->
  <text x="256" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="3">EduSAMS</text>
  <text x="256" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="4">SMART ATTENDANCE</text>
</svg>