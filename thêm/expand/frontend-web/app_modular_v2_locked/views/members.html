  <div class="view" id="view-members">
    <div class="section-hdr">
      <div>
        <div class="section-title">👥 Quản Lý Thành Viên & Nhân Sự</div>
        <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">Hiệu trưởng chủ động cập nhật số điện thoại, email, vai trò cấp dưới (Giáo viên, Giám thị, Phụ huynh, Học sinh)</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="memberSearch" placeholder="🔍 Tìm tên, sđt, email..." style="padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);outline:none;font-size:0.85rem;" oninput="loadSchoolMembers()">
        <select id="memberRoleFilter" style="padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);outline:none;font-size:0.85rem;" onchange="loadSchoolMembers()">
          <option value="ALL">Tất cả vai trò</option>
          <option value="TEACHER">Giáo viên</option>
          <option value="INSPECTOR">Giám thị / Sao đỏ</option>
          <option value="PARENT">Phụ huynh</option>
          <option value="STUDENT">Học sinh</option>
          <option value="HEADMASTER">Hiệu trưởng / BGH</option>
        </select>
        <button class="btn btn-outline" onclick="loadSchoolMembers()">🔄 Tải Lại</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Họ Tên</th><th>Tài Khoản</th><th>Vai Trò</th><th>Mã Định Danh</th><th>Số Điện Thoại</th><th>Email</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
        <tbody id="membersBody"><tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">Đang tải danh sách...</td></tr></tbody>
      </table>
    </div>
  </div>
