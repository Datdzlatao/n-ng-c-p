  <div class="view" id="view-students">
    <div class="section-hdr">
      <div>
        <div class="section-title">👥 Danh Sách Học Sinh & Hồ Sơ FaceID</div>
        <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">Mỗi học sinh được cấp Mã HS riêng biệt, Thẻ QR động & Bộ ảnh FaceID đa góc</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="text" id="stuSearch" placeholder="🔍 Tìm tên, mã HS..." style="padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);outline:none;" oninput="loadStudents()">
        <button class="btn btn-primary" style="background:var(--purple);" onclick="openFaceIDScanner(null)">📸 Cấp Mã & Quét FaceID</button>
        <button class="btn btn-outline" onclick="openModal('modalAddStudent')">+ Thêm Thủ Công</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Ảnh FaceID</th><th>Mã HS</th><th>Họ Tên</th><th>Lớp</th><th>Phụ Huynh & Liên Kết</th><th>Điểm</th><th>Thẻ QR & Chi Tiết</th><th>Thao Tác</th></tr></thead>
        <tbody id="stuBody"><tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted);">Đang tải...</td></tr></tbody>
      </table>
    </div>
  </div>
