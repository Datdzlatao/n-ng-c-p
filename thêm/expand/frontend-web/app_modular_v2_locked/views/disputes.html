  <div class="view" id="view-disputes">
    <div class="section-hdr">
      <div class="section-title">⚖️ Khiếu Nại Nề Nếp</div>
      <div style="display:flex;gap:8px;">
        <select id="disputeFilter" onchange="loadDisputes()" style="padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);outline:none;">
          <option value="">Tất cả trạng thái</option>
          <option value="PENDING">Chờ Xử Lý</option>
          <option value="APPROVED">Đã Chấp Nhận</option>
          <option value="REJECTED">Đã Từ Chối</option>
          <option value="ESCALATED">Đã Leo Thang</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Học Sinh</th><th>Lớp</th><th>Lý Do</th><th>Cấp</th><th>Trạng Thái</th><th>Ngày Gửi</th><th>Thao Tác</th></tr></thead>
        <tbody id="disputeBody"></tbody>
      </table>
    </div>
  </div>
